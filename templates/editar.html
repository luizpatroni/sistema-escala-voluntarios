<!DOCTYPE html>
<html>
<head>
    <title>Editar Voluntário</title>
</head>
<body>

<h1>Editar Voluntário</h1>

<form method="post">

    Nome:
    <input
        type="text"
        name="nome"
        value="{{voluntario[1]}}"
        required
    >

    <br><br>

    Telefone:
    <input
        type="text"
        name="telefone"
        value="{{voluntario[2]}}"
    >

    <br><br>

    <button type="submit">
    <br><br>

    Parceiro:

    <select name="parceiro_id">

        <option value="">
            Nenhum
        </option>

        {% for v in voluntarios %}

            <option value="{{v[0]}}">

                {{v[1]}}

            </option>

        {% endfor %}

    </select>

    <br><br>
        Salvar
    </button>

</form>

<br>

<a href="/">Voltar</a>

</body>
</html>
